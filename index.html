<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion de Comptes Remi</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f8; }
    h1 { color: #333; }
    
    /* Navigation par onglets (pages) */
    .tabs { display: flex; gap: 5px; margin-bottom: -1px; }
    .tab-btn { padding: 10px 20px; background: #e0e0e0; border: 1px solid #ccc; border-bottom: none; border-radius: 6px 6px 0 0; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: white; border-top: 3px solid #007bff; color: #007bff; }
    
    .card { background: white; padding: 20px; border-radius: 0 8px 8px 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; border: 1px solid #ccc; }
    form { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    input, button { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { background-color: #28a745; color: white; border: none; cursor: pointer; }
    button:hover { background-color: #218838; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    .amount { text-align: right; }
    .center { text-align: center; }
    .negative { color: red; font-weight: bold; }
    .btn-delete { background-color: #dc3545; padding: 4px 8px; font-size: 12px; }
  </style>
</head>
<body>

  <h1>Gestion de Comptes — Remi</h1>

  <!-- Onglets pour basculer entre les 2 pages -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchPage('page1')">Page 1</button>
    <button class="tab-btn" onclick="switchPage('page2')">Page 2</button>
  </div>

  <div class="card">
    <h3 id="page-title">Ajouter une opération (Page 1)</h3>
    <form id="transaction-form">
      <input type="date" id="date" required>
      <input type="text" id="cheque" placeholder="CHEQUE (ex: N°)">
      <input type="text" id="ordre" placeholder="ORDRE / Libellé" required>
      <input type="number" step="0.01" id="retrait" placeholder="RETRAIT (€)">
      <input type="number" step="0.01" id="versement" placeholder="VERSEMENT (€)">
      <button type="submit">Ajouter</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>DATE</th>
          <th>CHEQUE</th>
          <th>ORDRE</th>
          <th class="amount">RETRAIT</th>
          <th class="amount">VERSEMENT</th>
          <th class="amount">SOLDE</th>
          <th class="center">Pointage</th>
          <th class="center">Action</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- Les lignes s'afficheront ici -->
      </tbody>
    </table>
  </div>

  <script>
    // Stockage séparé pour la Page 1 et la Page 2
    let currentPage = 'page1';
    let data = {
      page1: [],
      page2: []
    };

    const form = document.getElementById('transaction-form');
    const tableBody = document.getElementById('table-body');
    const pageTitle = document.getElementById('page-title');

    function switchPage(page) {
      currentPage = page;
      
      // Mise à jour de l'affichage des onglets
      document.querySelectorAll('.tab-btn').forEach((btn, index) => {
        btn.classList.toggle('active', (page === 'page1' && index === 0) || (page === 'page2' && index === 1));
      });
      
      pageTitle.textContent = `Ajouter une opération (${page === 'page1' ? 'Page 1' : 'Page 2'})`;
      render();
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const newTransaction = {
        id: Date.now(),
        date: document.getElementById('date').value,
        cheque: document.getElementById('cheque').value,
        ordre: document.getElementById('ordre').value,
        retrait: parseFloat(document.getElementById('retrait').value) || 0,
        versement: parseFloat(document.getElementById('versement').value) || 0,
        pointage: false
      };

      data[currentPage].push(newTransaction);
      form.reset();
      render();
    });

    function togglePointage(id) {
      data[currentPage] = data[currentPage].map(t => t.id === id ? { ...t, pointage: !t.pointage } : t);
      render();
    }

    function deleteTransaction(id) {
      data[currentPage] = data[currentPage].filter(t => t.id !== id);
      render();
    }

    function render() {
      tableBody.innerHTML = '';
      let currentSolde = 0;
      const transactions = data[currentPage];

      // Ligne Solde Initial
      const initialRow = document.createElement('tr');
      initialRow.innerHTML = `
        <td>-</td>
        <td>-</td>
        <td><strong>Solde initial</strong></td>
        <td class="amount">-</td>
        <td class="amount">-</td>
        <td class="amount"><strong>0,00 €</strong></td>
        <td class="center">-</td>
        <td></td>
      `;
      tableBody.appendChild(initialRow);

      // Tri par date
      transactions.sort((a, b) => new Date(a.date) - new Date(b.date));

      // Calcul du solde propre à la page active
      transactions.forEach(t => {
        currentSolde = currentSolde - t.retrait + t.versement;

        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${t.date}</td>
          <td>${t.cheque || ''}</td>
          <td>${t.ordre}</td>
          <td class="amount">${t.retrait > 0 ? t.retrait.toFixed(2) + ' €' : ''}</td>
          <td class="amount">${t.versement > 0 ? t.versement.toFixed(2) + ' €' : ''}</td>
          <td class="amount ${currentSolde < 0 ? 'negative' : ''}">${currentSolde.toFixed(2)} €</td>
          <td class="center">
            <input type="checkbox" ${t.pointage ? 'checked' : ''} onchange="togglePointage(${t.id})">
          </td>
          <td class="center">
            <button class="btn-delete" onclick="deleteTransaction(${t.id})">X</button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    render();
  </script>
</body>
</html>
