<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Comptes</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --primary-grad: linear-gradient(90deg, #2563eb 0%, #3b82f6 100%);
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --warning-bg: #fffbe3;
      --info-bg: #eff6ff;
      --border: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-gradient); color: #0f172a; padding: 12px 10px; min-height: 100vh; max-width: 1000px; margin: 0 auto; }
    
    h1 { font-size: 1.8rem; margin-bottom: 16px; color: #ffffff; font-weight: 900; text-align: center; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 3px 10px rgba(0,0,0,0.3); }

    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 14px 8px; border: none; background: rgba(255, 255, 255, 0.1); border-radius: 14px; font-weight: 800; font-size: 0.95rem; color: #ffffff; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(10px); border: 2px solid rgba(255,255,255,0.15); text-align: center; }
    .tab-btn.active { background: #3b82f6; color: #ffffff; box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4); border-color: #60a5fa; }

    .card { background: var(--card-bg); border-radius: 16px; padding: 16px; box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3); margin-bottom: 16px; }
    
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 12px; }
    @media (min-width: 600px) {
      .form-grid { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
    }

    input { padding: 14px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 1rem; font-weight: 600; outline: none; width: 100%; transition: all 0.2s; background: #f8fafc; -webkit-appearance: none; }
    input:focus { border-color: #3b82f6; background: #ffffff; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
    
    .btn-add { background: var(--primary-grad); color: white; border: none; border-radius: 10px; font-weight: 800; font-size: 1rem; cursor: pointer; padding: 14px; transition: all 0.2s ease; width: 100%; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 6px 15px rgba(37, 99, 235, 0.4); }
    .btn-add:active { transform: scale(0.98); }

    .table-container { overflow-x: auto; border-radius: 10px; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 500px; }
    th { text-align: left; padding: 12px 8px; color: #ffffff; font-weight: 800; background: #1e293b; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; }
    td { padding: 12px 8px; border-bottom: 1px solid #f1f5f9; font-weight: 600; }
    tr:hover td { background-color: #f8fafc; }
    
    .row-charges-total { background-color: var(--warning-bg) !important; border-left: 4px solid #f59e0b; }
    .row-charges-estime { background-color: var(--info-bg) !important; border-left: 4px solid #3b82f6; }

    .amount { text-align: right; white-space: nowrap; font-family: 'Courier New', monospace; font-size: 0.95rem; font-weight: 800; }
    .amount-plus { color: #10b981; background: var(--success-bg); padding: 3px 6px; border-radius: 6px; display: inline-block; }
    .amount-minus { color: var(--danger); background: var(--danger-bg); padding: 3px 6px; border-radius: 6px; display: inline-block; }
    .negative { color: var(--danger); font-weight: 900; }
    .center { text-align: center; }

    .summary { display: flex; flex-direction: column; gap: 8px; background: #0f172a; border-radius: 12px; padding: 14px; margin-top: 16px; font-weight: 800; color: #ffffff; font-size: 0.9rem; box-shadow: 0 6px 15px rgba(15, 23, 42, 0.4); }
    @media (min-width: 600px) {
      .summary { flex-direction: row; justify-content: space-between; align-items: center; }
    }
    .summary-val { font-size: 1.2rem; font-family: 'Courier New', monospace; color: #38bdf8; text-shadow: 0 0 8px rgba(56, 189, 248, 0.5); }

    .btn-del { background: #fef2f2; border: none; color: var(--danger); border-radius: 6px; cursor: pointer; font-size: 1rem; padding: 6px 10px; font-weight: 900; }
    input[type="checkbox"] { width: 24px; height: 24px; accent-color: #3b82f6; cursor: pointer; vertical-align: middle; }

    .sync-status { text-align: center; color: #a7f3d0; font-size: 0.8rem; font-weight: 700; margin-top: -10px; margin-bottom: 12px; }
  </style>
</head>
<body>

  <h1>💳 Mes Comptes 💳</h1>
  <div class="sync-status" id="sync-status">🟢 Synchronisation Firebase Active</div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchPage('page1')">Dépenses & Revenus</button>
    <button class="tab-btn" onclick="switchPage('page2')">Fixes & Mensuels</button>
  </div>

  <div class="card">
    <form id="transaction-form">
      <div class="form-grid" id="form-fields"></div>
      <button type="submit" class="btn-add">+ Ajouter l'opération</button>
    </form>
  </div>

  <div class="card">
    <div class="table-container">
      <table>
        <thead>
          <tr id="table-head"></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <div class="summary" id="summary-bar"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCHh9JL1E3Trgxv-XGdoCyR8Ay8SIWepBo",
      authDomain: "mes-comptes-7a597.firebaseapp.com",
      databaseURL: "https://mes-comptes-7a597-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "mes-comptes-7a597",
      storageBucket: "mes-comptes-7a597.firebasestorage.app",
      messagingSenderId: "364718028394",
      appId: "1:364718028394:web:0ab4cc30259b4fe477fc13"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'comptes_data');

    let currentPage = 'page1';
    let data = { page1: [], page2: [] };

    onValue(dbRef, (snapshot) => {
      const val = snapshot.val();
      if (val) {
        data = {
          page1: val.page1 || [],
          page2: val.page2 || []
        };
      }
      render();
    });

    function save() {
      set(dbRef, data);
    }

    window.switchPage = function(page) {
      currentPage = page;
      document.querySelectorAll('.tab-btn').forEach((btn, index) => {
        btn.classList.toggle('active', (page === 'page1' && index === 0) || (page === 'page2' && index === 1));
      });
      updateFormAndHead();
      render();
    };

    function updateFormAndHead() {
      const formFields = document.getElementById('form-fields');
      const tableHead = document.getElementById('table-head');

      if (currentPage === 'page1') {
        formFields.innerHTML = `
          <input type="date" id="date" required>
          <input type="text" id="cheque" placeholder="Chèque (optionnel)">
          <input type="text" id="ordre" placeholder="Libellé / Ordre" required>
          <input type="number" step="0.01" id="retrait" placeholder="Retrait (€)">
          <input type="number" step="0.01" id="versement" placeholder="Versement (€)">
        `;
        tableHead.innerHTML = `
          <th>Date</th>
          <th>Chèque</th>
          <th>Libellé</th>
          <th class="amount">Retrait</th>
          <th class="amount">Versement</th>
          <th class="amount">Solde</th>
          <th class="center">Pointé</th>
          <th class="center">Action</th>
        `;
      } else {
        const allChecked = data.page2.length > 0 && data.page2.every(t => t.pointage);
        formFields.innerHTML = `
          <input type="text" id="cheque" placeholder="Chèque (optionnel)">
          <input type="text" id="ordre" placeholder="Nom de l'opération" required>
          <input type="number" step="0.01" id="retrait" placeholder="Charge / Débit (€)">
          <input type="number" step="0.01" id="versement" placeholder="Revenu / Crédit (€)">
        `;
        tableHead.innerHTML = `
          <th>Chèque</th>
          <th>Nom / Libellé</th>
          <th class="amount">Charge (-</th>
          <th class="amount">Revenu (+)</th>
          <th class="center">
            Tout 
            <input type="checkbox" id="toggle-all-charges" ${allChecked ? 'checked' : ''}>
          </th>
          <th class="center">Action</th>
        `;
        
        setTimeout(() => {
          const toggleAll = document.getElementById('toggle-all-charges');
          if (toggleAll) {
            toggleAll.onchange = (e) => toggleAllCharges(e.target.checked);
          }
        }, 50);
      }
    }

    document.getElementById('transaction-form').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const newEntry = {
        id: Date.now(),
        cheque: document.getElementById('cheque').value,
        ordre: document.getElementById('ordre').value,
        retrait: parseFloat(document.getElementById('retrait').value) || 0,
        versement: parseFloat(document.getElementById('versement').value) || 0,
        pointage: false
      };

      if (currentPage === 'page1') {
        newEntry.date = document.getElementById('date').value;
      }

      data[currentPage].push(newEntry);
      save();
      e.target.reset();
    });

    window.togglePointage = function(id, pageSource) {
      const page = pageSource || currentPage;
      data[page] = data[page].map(t => t.id === id ? { ...t, pointage: !t.pointage } : t);
      save();
    };

    function toggleAllCharges(status) {
      data.page2 = data.page2.map(t => ({ ...t, pointage: status }));
      save();
    }

    window.deleteTransaction = function(id) {
      data[currentPage] = data[currentPage].filter(t => t.id !== id);
      save();
    };

    // Calcule l'impact net total de la feuille 2 (Versemens - Retraits)
    function getNetChargesTotal() {
      return data.page2.reduce((total, t) => total + (t.versement - t.retrait), 0);
    }

    // Calcule l'impact net des éléments pointés de la feuille 2
    function getNetChargesPointees() {
      return data.page2.filter(t => t.pointage).reduce((total, t) => total + (t.versement - t.retrait), 0);
    }

    function render() {
      const tableBody = document.getElementById('table-body');
      const summaryBar = document.getElementById('summary-bar');
      tableBody.innerHTML = '';
      
      let currentSolde = 0;
      const netChargesTotal = getNetChargesTotal();
      const netChargesPointees = getNetChargesPointees();

      if (currentPage === 'page1') {
        tableBody.innerHTML += `
          <tr>
            <td style="color: var(--text-muted)">-</td>
            <td style="color: var(--text-muted)">-</td>
            <td><strong>Solde initial</strong></td>
            <td class="amount">-</td>
            <td class="amount">-</td>
            <td class="amount"><strong>0,00 €</strong></td>
            <td class="center">-</td>
            <td></td>
          </tr>
        `;

        if (data.page2.length > 0) {
          currentSolde += netChargesPointees;

          tableBody.innerHTML += `
            <tr class="row-charges-total">
              <td style="color: var(--text-muted)">—</td>
              <td style="color: var(--text-muted)">—</td>
              <td><strong style="color: #b45309;">Éléments Mensuels Pointés (Feuille 2)</strong></td>
              <td class="amount">${netChargesPointees < 0 ? '<span class="amount-minus">' + netChargesPointees.toFixed(2) + ' €</span>' : '-'}</td>
              <td class="amount">${netChargesPointees > 0 ? '<span class="amount-plus">+' + netChargesPointees.toFixed(2) + ' €</span>' : '-'}</td>
              <td class="amount ${currentSolde < 0 ? 'negative' : ''}">${currentSolde.toFixed(2)} €</td>
              <td class="center">-</td>
              <td></td>
            </tr>
          `;
        }

        const sortedOps = [...data.page1].sort((a, b) => new Date(a.date) - new Date(b.date));

        sortedOps.forEach(t => {
          if (t.pointage) {
            currentSolde = currentSolde - t.retrait + t.versement;
          }

          const row = document.createElement('tr');
          row.innerHTML = `
            <td style="color: var(--text-muted)">${t.date}</td>
            <td style="color: var(--text-muted)">${t.cheque || '-'}</td>
            <td><strong>${t.ordre}</strong></td>
            <td class="amount">${t.retrait > 0 ? '<span class="amount-minus">-' + t.retrait.toFixed(2) + ' €</span>' : ''}</td>
            <td class="amount">${t.versement > 0 ? '<span class="amount-plus">+' + t.versement.toFixed(2) + ' €</span>' : ''}</td>
            <td class="amount ${currentSolde < 0 ? 'negative' : ''}">${currentSolde.toFixed(2)} €</td>
            <td class="center">
              <input type="checkbox" ${t.pointage ? 'checked' : ''} onchange="togglePointage(${t.id}, 'page1')">
            </td>
            <td class="center">
              <button class="btn-del" onclick="deleteTransaction(${t.id})">✕</button>
            </td>
          `;
          tableBody.appendChild(row);
        });

        const chargesRestantes = netChargesTotal - netChargesPointees;
        const soldeApresToutesCharges = currentSolde + chargesRestantes;

        if (data.page2.length > 0) {
          tableBody.innerHTML += `
            <tr class="row-charges-estime">
              <td style="color: var(--text-muted)">—</td>
              <td style="color: var(--text-muted)">—</td>
              <td><strong style="color: #1d4ed8;">Solde Final (Tous mensuels inclus)</strong></td>
              <td class="amount">-</td>
              <td class="amount">-</td>
              <td class="amount ${soldeApresToutesCharges < 0 ? 'negative' : ''}"><strong>${soldeApresToutesCharges.toFixed(2)} €</strong></td>
              <td class="center">-</td>
              <td></td>
            </tr>
          `;
        }

        summaryBar.innerHTML = `
          <div>Solde Réel : <span class="summary-val ${currentSolde < 0 ? 'negative' : ''}">${currentSolde.toFixed(2)} €</span></div>
          <div>Solde Estimé Fin de Mois : <span class="summary-val ${soldeApresToutesCharges < 0 ? 'negative' : ''}">${soldeApresToutesCharges.toFixed(2)} €</span></div>
        `;

      } else {
        data.page2.forEach(t => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td style="color: var(--text-muted)">${t.cheque || '-'}</td>
            <td><strong>${t.ordre}</strong></td>
            <td class="amount">${t.retrait > 0 ? '<span class="amount-minus">-' + t.retrait.toFixed(2) + ' €</span>' : '-'}</td>
            <td class="amount">${t.versement > 0 ? '<span class="amount-plus">+' + t.versement.toFixed(2) + ' €</span>' : '-'}</td>
            <td class="center">
              <input type="checkbox" ${t.pointage ? 'checked' : ''} onchange="togglePointage(${t.id}, 'page2')">
            </td>
            <td class="center">
              <button class="btn-del" onclick="deleteTransaction(${t.id})">✕</button>
            </td>
          `;
          tableBody.appendChild(row);
        });

        const totalRetraits = data.page2.reduce((acc, t) => acc + t.retrait, 0);
        const totalVersements = data.page2.reduce((acc, t) => acc + t.versement, 0);

        summaryBar.innerHTML = `
          <div>Débits : <strong style="color: #ef4444;">-${totalRetraits.toFixed(2)} €</strong> | Crédits : <strong style="color: #10b981;">+${totalVersements.toFixed(2)} €</strong></div>
          <div>Bilan Mensuel : <strong style="color: #38bdf8;">${netChargesTotal >= 0 ? '+' : ''}${netChargesTotal.toFixed(2)} €</strong></div>
        `;
      }
    }

    updateFormAndHead();
  </script>
</body>
</html>
