<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion de Comptes</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 { font-size: 1.8rem; font-weight: 700; }

    #user-badge {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .tab-btn:hover { color: var(--text-main); }

    .tab-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    form {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    form input[type="text"],
    form input[type="number"],
    form input[type="date"] {
      background: var(--bg-color);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      flex: 1;
      min-width: 140px;
    }

    form input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
    }

    button[type="submit"] {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button[type="submit"]:hover { background: var(--accent-hover); }

    .table-container {
      overflow-x: auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--card-border);
    }

    th {
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr:last-child td { border-bottom: none; }

    .amount { text-align: right; font-weight: 600; }
    .amount-minus { color: var(--danger); }
    .amount-plus { color: var(--success); }
    .center { text-align: center; }
    .negative { color: var(--danger) !important; }

    .btn-del {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .btn-del:hover { color: var(--danger); background: rgba(239, 68, 68, 0.1); }

    .row-reserve { background-color: rgba(245, 158, 11, 0.05); }
    .row-charges-total { background-color: rgba(59, 130, 246, 0.05); }

    .tag-reserve {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-right: 6px;
      font-weight: 600;
    }

    .summary-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
    }

    .summary-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .summary-val {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .summary-val.reserve { color: var(--warning); }
    .summary-val.total { color: var(--accent); }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Mes Comptes</h1>
      <div id="user-badge">Chargement de la clé...</div>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchPage('page1')">Opérations</button>
      <button class="tab-btn" onclick="switchPage('page2')">Charges Fixes</button>
    </div>

    <div class="card">
      <form id="transaction-form">
        <div id="form-fields" style="display: flex; gap: 12px; flex-wrap: wrap; flex: 1;"></div>
        <button type="submit">Ajouter</button>
      </form>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr id="table-head"></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <div id="summary-bar" class="summary-bar"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    function getUserKey() {
      const urlParams = new URLSearchParams(window.location.search);
      let userParam = urlParams.get('user');
      let storedUser = localStorage.getItem('mes_comptes_user_key');

      if (userParam === 'new' || (!userParam && !storedUser)) {
        const newKey = 'usr_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('mes_comptes_user_key', newKey);
        const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?user=' + newKey;
        window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
        return newKey;
      }

      if (userParam && userParam !== 'new') {
        localStorage.setItem('mes_comptes_user_key', userParam);
        return userParam;
      }

      if (storedUser) {
        if (!urlParams.get('user')) {
          const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?user=' + storedUser;
          window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
        }
        return storedUser;
      }

      const fallbackKey = 'usr_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('mes_comptes_user_key', fallbackKey);
      return fallbackKey;
    }

    const currentUserId = getUserKey();
    
    const userBadgeEl = document.getElementById('user-badge');
    if (userBadgeEl) {
      userBadgeEl.innerHTML = `Clé : <strong style="color:var(--text-main)">${currentUserId}</strong> <button onclick="resetUserKey()" style="margin-left:8px;cursor:pointer;background:var(--danger);color:white;border:none;padding:3px 8px;border-radius:4px;font-size:11px;">Nouveau compte</button>`;
    }

    window.resetUserKey = function() {
      if (confirm("Voulez-vous générer un nouvel accès vierge ?")) {
        localStorage.removeItem('mes_comptes_user_key');
        window.location.href = window.location.pathname + '?user=new';
      }
    };

    const firebaseConfig = {
      apiKey: "AIzaSyCHh9JL1E3Trgxv-XGdoCyR8Ay8SIWepBo",
      authDomain: "mes-comptes-7a597.firebaseapp.com",
      databaseURL: "https://mes-comptes-7a597-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "mes-comptes-7a597",
      storageBucket: "mes-comptes-7a597.firebasestorage.app",
      messagingSenderId: "364718028394",
      appId: "1:364718028394:web:0ab4cc30259b4fe477fc13"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const userDbRef = ref(db, 'comptes_data_users/' + currentUserId);

    let currentPage = 'page1';
    let data = { page1: [], page2: [] };

    onValue(userDbRef, (snapshot) => {
      const val = snapshot.val();
      data = val ? { page1: val.page1 || [], page2: val.page2 || [] } : { page1: [], page2: [] };
      render();
    });

    function save() {
      set(userDbRef, data);
    }

    window.switchPage = function(page) {
      currentPage = page;
      document.querySelectorAll('.tab-btn').forEach((btn, index) => {
        btn.classList.toggle('active', (page === 'page1' && index === 0) || (page === 'page2' && index === 1));
      });
      updateFormAndHead();
      render();
    };

    function updateFormAndHead() {
      const formFields = document.getElementById('form-fields');
      const tableHead = document.getElementById('table-head');

      if (currentPage === 'page1') {
        const today = new Date().toISOString().split('T')[0];
        formFields.innerHTML = `
          <input type="date" id="date" value="${today}" required>
          <input type="text" id="cheque" placeholder="Chèque (optionnel)">
          <input type="text" id="ordre" placeholder="Libellé / Intitulé" required>
          <input type="number" step="0.01" id="retrait" placeholder="Retrait (€)">
          <input type="number" step="0.01" id="versement" placeholder="Versement (€)">
          <label class="checkbox-field">
            <input type="checkbox" id="is-reserve"> Réserve ?
          </label>
        `;
        tableHead.innerHTML = `
          <th>Date</th>
          <th>Chèque</th>
          <th>Libellé</th>
          <th class="amount">Retrait</th>
          <th class="amount">Versement</th>
          <th class="amount">Solde Total</th>
          <th class="center">Pointé</th>
          <th class="center">Action</th>
        `;
      } else {
        const allChecked = data.page2.length > 0 && data.page2.every(t => t.pointage);
        formFields.innerHTML = `
          <input type="text" id="cheque" placeholder="Chèque (optionnel)">
          <input type="text" id="ordre" placeholder="Nom de l'opération" required>
          <input type="number" step="0.01" id="retrait" placeholder="Charge / Débit (€)">
          <input type="number" step="0.01" id="versement" placeholder="Revenu / Crédit (€)">
        `;
        tableHead.innerHTML = `
          <th>Chèque</th>
          <th>Nom / Libellé</th>
          <th class="amount">Charge (-)</th>
          <th class="amount">Revenu (+)</th>
          <th class="center">
            Tout <input type="checkbox" id="toggle-all-charges" ${allChecked ? 'checked' : ''}>
          </th>
          <th class="center">Action</th>
        `;
        
        setTimeout(() => {
          const toggleAll = document.getElementById('toggle-all-charges');
          if (toggleAll) toggleAll.onchange = (e) => toggleAllCharges(e.target.checked);
        }, 50);
      }
    }

    document.getElementById('transaction-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const isReserveEl = document.getElementById('is-reserve');
      const newEntry = {
        id: Date.now(),
        cheque: document.getElementById('cheque').value,
        ordre: document.getElementById('ordre').value,
        retrait: parseFloat(document.getElementById('retrait').value) || 0,
        versement: parseFloat(document.getElementById('versement').value) || 0,
        pointage: false,
        isReserve: isReserveEl ? isReserveEl.checked : false
      };

      if (currentPage === 'page1') {
        newEntry.date = document.getElementById('date').value;
      }

      data[currentPage].push(newEntry);
      save();
      
      e.target.reset();
      const dateEl = document.getElementById('date');
      if (dateEl) dateEl.value = new Date().toISOString().split('T')[0];
    });

    window.togglePointage = function(id, pageSource) {
      const page = pageSource || currentPage;
      data[page] = data[page].map(t => t.id === id ? { ...t, pointage: !t.pointage } : t);
      save();
    };

    function toggleAllCharges(status) {
      data.page2 = data.page2.map(t => ({ ...t, pointage: status }));
      save();
    }

    window.deleteTransaction = function(id) {
      data[currentPage] = data[currentPage].filter(t => t.id !== id);
      save();
    };

    function getNetChargesTotal() {
      return data.page2.reduce((total, t) => total + (t.versement - t.retrait), 0);
    }

    function getNetChargesPointees() {
      return data.page2.filter(t => t.pointage).reduce((total, t) => total + (t.versement - t.retrait), 0);
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      const parts = dateStr.split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateStr;
    }

    function render() {
      const tableBody = document.getElementById('table-body');
      const summaryBar = document.getElementById('summary-bar');
      tableBody.innerHTML = '';
      
      let soldeCompte = 0;
      let soldeReserve = 0;
      const netChargesPointees = getNetChargesPointees();

      if (currentPage === 'page1') {
        tableBody.innerHTML += `
          <tr>
            <td style="color: var(--text-muted)">-</td>
            <td style="color: var(--text-muted)">-</td>
            <td><strong>Solde initial</strong></td>
            <td class="amount">-</td>
            <td class="amount">-</td>
            <td class="amount"><strong>0,00 €</strong></td>
            <td class="center">-</td>
            <td></td>
          </tr>
        `;

        if (data.page2.length > 0) {
          soldeCompte += netChargesPointees;
          tableBody.innerHTML += `
            <tr class="row-charges-total">
              <td style="color: var(--text-muted)">—</td>
              <td style="color: var(--text-muted)">—</td>
              <td><strong style="color: #f59e0b;">Éléments Mensuels Pointés (Feuille 2)</strong></td>
              <td class="amount">${netChargesPointees < 0 ? '<span class="amount-minus">' + netChargesPointees.toFixed(2) + ' €</span>' : '-'}</td>
              <td class="amount">${netChargesPointees > 0 ? '<span class="amount-plus">+' + netChargesPointees.toFixed(2) + ' €</span>' : '-'}</td>
              <td class="amount ${soldeCompte < 0 ? 'negative' : ''}">${soldeCompte.toFixed(2)} €</td>
              <td class="center">-</td>
              <td></td>
            </tr>
          `;
        }

        const sortedOps = [...data.page1].sort((a, b) => new Date(a.date) - new Date(b.date));

        sortedOps.forEach(t => {
          if (t.pointage) {
            if (t.isReserve) {
              soldeReserve = soldeReserve - t.retrait + t.versement;
            } else {
              soldeCompte = soldeCompte - t.retrait + t.versement;
            }
          }

          const currentTotal = soldeCompte + soldeReserve;
          const row = document.createElement('tr');
          if (t.isReserve) row.classList.add('row-reserve');

          row.innerHTML = `
            <td style="color: var(--text-muted)">${formatDate(t.date)}</td>
            <td style="color: var(--text-muted)">${t.cheque || '-'}</td>
            <td>${t.isReserve ? '<span class="tag-reserve">Réserve</span>' : ''} <strong>${t.ordre}</strong></td>
            <td class="amount">${t.retrait > 0 ? '<span class="amount-minus">-' + t.retrait.toFixed(2) + ' €</span>' : ''}</td>
            <td class="amount">${t.versement > 0 ? '<span class="amount-plus">+' + t.versement.toFixed(2) + ' €</span>' : ''}</td>
            <td class="amount ${currentTotal < 0 ? 'negative' : ''}">${currentTotal.toFixed(2)} €</td>
            <td class="center">
              <input type="checkbox" ${t.pointage ? 'checked' : ''} onchange="togglePointage(${t.id}, 'page1')">
            </td>
            <td class="center">
              <button class="btn-del" onclick="deleteTransaction(${t.id})">✕</button>
            </td>
          `;
          tableBody.appendChild(row);
        });

        const soldeTotalGlobal = soldeCompte + soldeReserve;
        summaryBar.innerHTML = `
          <div class="summary-card">
            <div class="summary-title">Solde Compte (Pointé)</div>
            <div class="summary-val ${soldeCompte < 0 ? 'negative' : ''}">${soldeCompte.toFixed(2)} €</div>
          </div>
          <div class="summary-card">
            <div class="summary-title">Solde Réserves Seules</div>
            <div class="summary-val reserve">${soldeReserve.toFixed(2)} €</div>
          </div>
          <div class="summary-card">
            <div class="summary-title">Solde Total (Compte + Réserves)</div>
            <div class="summary-val total">${soldeTotalGlobal.toFixed(2)} €</div>
          </div>
        `;

      } else {
        data.page2.forEach(t => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td style="color: var(--text-muted)">${t.cheque || '-'}</td>
            <td><strong>${t.ordre}</strong></td>
            <td class="amount">${t.retrait > 0 ? '<span class="amount-minus">-' + t.retrait.toFixed(2) + ' €</span>' : '-'}</td>
            <td class="amount">${t.versement > 0 ? '<span class="amount-plus">+' + t.versement.toFixed(2) + ' €</span>' : '-'}</td>
            <td class="center">
              <input type="checkbox" ${t.pointage ? 'checked' : ''} onchange="togglePointage(${t.id}, 'page2')">
            </td>
            <td class="center">
              <button class="btn-del" onclick="deleteTransaction(${t.id})">✕</button>
            </td>
          `;
          tableBody.appendChild(row);
        });

        const totalRetraits = data.page2.reduce((acc, t) => acc + t.retrait, 0);
        const totalVersements = data.page2.reduce((acc, t) => acc + t.versement, 0);
        const netChargesTotal = getNetChargesTotal();

        summaryBar.innerHTML = `
          <div class="summary-card">
            <div class="summary-title">Total Charges / Débits</div>
            <div class="summary-val negative">-${totalRetraits.toFixed(2)} €</div>
          </div>
          <div class="summary-card">
            <div class="summary-title">Total Revenus / Crédits</div>
            <div class="summary-val" style="color:var(--success);">+${totalVersements.toFixed(2)} €</div>
          </div>
          <div class="summary-card">
            <div class="summary-title">Bilan Mensuel Fixe</div>
            <div class="summary-val">${netChargesTotal >= 0 ? '+' : ''}${netChargesTotal.toFixed(2)} €</div>
          </div>
        `;
      }
    }

    updateFormAndHead();
  </script>
</body>
</html>
