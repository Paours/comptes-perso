<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion de Comptes</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      line-height: 1.5;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 { font-size: 1.8rem; font-weight: 700; }

    .badge-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    #user-badge {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    #status-badge {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .tabs-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .tabs { display: flex; gap: 10px; }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .tab-btn:hover { color: var(--text-main); }

    .tab-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .filter-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .filter-container label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .filter-container select {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    form {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    form input[type="text"],
    form input[type="number"],
    form input[type="date"],
    form select {
      background: var(--bg-color);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      flex: 1;
      min-width: 140px;
    }

    form input:focus,
    form select:focus {
      outline: none;
      border-color: var(--accent);
    }

    button[type="submit"] {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    button[type="submit"]:hover {
      background: var(--accent-hover);
    }

    .btn-reset-charges {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--warning);
      color: var(--warning);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset-charges:hover {
      background: var(--warning);
      color: #0f172a;
    }

    .table-container {
      overflow-x: auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--card-border);
    }

    th {
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr:last-child td { border-bottom: none; }

    .amount {
      text-align: right;
      font-weight: 600;
    }

    .amount-minus { color: var(--danger); }
    .amount-plus { color: var(--success); }
    .center { text-align: center; }
    .negative { color: var(--danger) !important; }

    .btn-del {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .btn-del:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    .tag-reserve {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-right: 6px;
      font-weight: 600;
    }

    .summary-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
    }

    .summary-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .summary-val {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .summary-val.reserve { color: var(--warning); }
    .summary-val.total { color: var(--accent); }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>

<body>

  <div class="container">

    <header>
      <h1>Mes Comptes</h1>
      <div class="badge-container">
        <div id="user-badge">Chargement...</div>
        <div id="status-badge">🟡 Connexion en cours...</div>
      </div>
    </header>

    <div class="tabs-bar">
      <div class="tabs">
        <button id="btn-tab1" class="tab-btn active">Opérations</button>
        <button id="btn-tab2" class="tab-btn">Charges Fixes</button>
      </div>

      <div class="filter-container" id="month-filter-wrapper">
        <label for="month-filter">Période :</label>
        <select id="month-filter"></select>
      </div>

      <div class="filter-container" id="reset-charges-wrapper" style="display: none;">
        <button id="btn-reset-charges" class="btn-reset-charges">
          ↺ Réinitialiser l'état du mois
        </button>
      </div>
    </div>

    <div class="card">
      <form id="transaction-form">
        <div id="form-fields" style="display:flex;gap:12px;flex-wrap:wrap;flex:1;"></div>
        <button type="submit">Ajouter</button>
      </form>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr id="table-head"></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <div id="summary-bar" class="summary-bar"></div>

  </div>

  <script>
    /* =========================================================
       UTILISATEUR
    ========================================================= */
    function getUserKey() {
      const urlParams = new URLSearchParams(window.location.search);
      let userParam = urlParams.get('user');
      let storedUser = localStorage.getItem('mes_comptes_user_key');

      if (userParam && userParam !== 'new') {
        localStorage.setItem('mes_comptes_user_key', userParam);
        return userParam;
      }

      if (storedUser) {
        if (!urlParams.get('user')) {
          const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?user=' + storedUser;
          window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
        }
        return storedUser;
      }

      const newKey = 'usr_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('mes_comptes_user_key', newKey);
      const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?user=' + newKey;
      window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
      return newKey;
    }

    const currentUserId = getUserKey();
    document.getElementById('user-badge').innerHTML = `Clé : <strong style="color:var(--text-main);margin-left:4px;">${currentUserId}</strong>`;

    /* =========================================================
       FIREBASE
    ========================================================= */
    const firebaseConfig = {
      apiKey: "AIzaSyCHh9JL1E3Trgxv-XGdoCyR8Ay8SIWepBo",
      authDomain: "mes-comptes-7a597.firebaseapp.com",
      databaseURL: "https://mes-comptes-7a597-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "mes-comptes-7a597",
      storageBucket: "mes-comptes-7a597.firebasestorage.app",
      messagingSenderId: "364718028394",
      appId: "1:364718028394:web:0ab4cc30259b4fe477fc13"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const db = firebase.database();
    const userDbRef = db.ref('comptes_data_users/' + currentUserId);

    /* =========================================================
       DONNEES
    ========================================================= */
    let currentPage = 'page1';
    let data = {
      page1: [],
      page2: [],
      monthlyChargesState: {},
      reservesCategories: ['Vacances', 'Noël']
    };

    const now = new Date();
    const currentYYYYMM = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    let selectedMonth = currentYYYYMM;

    /* =========================================================
       BACKUP LOCAL
    ========================================================= */
    const localBackup = localStorage.getItem('backup_data_' + currentUserId);
    if (localBackup) {
      try {
        data = JSON.parse(localBackup);
        if (!data.monthlyChargesState) data.monthlyChargesState = {};
        if (!data.reservesCategories) data.reservesCategories = ['Vacances', 'Noël'];
        updateMonthFilterOptions();
        updateFormAndHead();
        render();
      } catch (e) {
        console.error('Erreur lecture backup local', e);
      }
    }

    /* =========================================================
       STATUT FIREBASE
    ========================================================= */
    db.ref('.info/connected').on('value', (snap) => {
      const statusEl = document.getElementById('status-badge');
      if (snap.val() === true) {
        statusEl.innerHTML = '🟢 Connecté';
        statusEl.style.color = 'var(--success)';
      } else {
        statusEl.innerHTML = '🔴 Hors ligne (Mode local)';
        statusEl.style.color = 'var(--danger)';
      }
    });

    /* =========================================================
       CHARGEMENT FIREBASE
    ========================================================= */
    userDbRef.on('value', (snapshot) => {
      const val = snapshot.val();
      if (val) {
        data = {
          page1: Array.isArray(val.page1) ? val.page1 : [],
          page2: Array.isArray(val.page2) ? val.page2 : [],
          monthlyChargesState: val.monthlyChargesState || {},
          reservesCategories: Array.isArray(val.reservesCategories) ? val.reservesCategories : ['Vacances', 'Noël']
        };
        localStorage.setItem('backup_data_' + currentUserId, JSON.stringify(data));
      }
      updateMonthFilterOptions();
      updateFormAndHead();
      render();
    });

    /* =========================================================
       ETAT CHARGES FIXES
    ========================================================= */
    function getChargeState(chargeId, monthKey) {
      const activeMonth = monthKey === 'ALL' ? currentYYYYMM : monthKey;
      if (data.monthlyChargesState && data.monthlyChargesState[activeMonth] && data.monthlyChargesState[activeMonth][chargeId]) {
        return data.monthlyChargesState[activeMonth][chargeId];
      }
      const charge = (data.page2 || []).find(c => c.id === chargeId);
      return {
        pointage: charge ? Boolean(charge.pointage) : false,
        traite: charge ? Boolean(charge.traite) : false
      };
    }

    function setChargeState(chargeId, monthKey, key, value) {
      const activeMonth = monthKey === 'ALL' ? currentYYYYMM : monthKey;
      if (!data.monthlyChargesState) data.monthlyChargesState = {};
      if (!data.monthlyChargesState[activeMonth]) data.monthlyChargesState[activeMonth] = {};
      const current = getChargeState(chargeId, activeMonth);
      current[key] = value;
      data.monthlyChargesState[activeMonth][chargeId] = current;
    }

    function cleanDataForFirebase(obj) {
      return JSON.parse(JSON.stringify(obj, (key, value) => value === undefined ? null : value));
    }

    function save() {
      const cleanData = cleanDataForFirebase(data);
      localStorage.setItem('backup_data_' + currentUserId, JSON.stringify(cleanData));
      userDbRef.set(cleanData).catch(err => {
        console.error("Erreur de sauvegarde Firebase : ", err);
      });
      render();
    }

    /* =========================================================
       CHANGEMENT D'ONGLET
    ========================================================= */
    function switchPage(page) {
      currentPage = page;
      document.getElementById('btn-tab1').classList.toggle('active', page === 'page1');
      document.getElementById('btn-tab2').classList.toggle('active', page === 'page2');
      document.getElementById('reset-charges-wrapper').style.display = page === 'page2' ? 'flex' : 'none';
      updateFormAndHead();
      render();
    }

    document.getElementById('btn-tab1').addEventListener('click', () => switchPage('page1'));
    document.getElementById('btn-tab2').addEventListener('click', () => switchPage('page2'));

    /* =========================================================
       RESET CHARGES
    ========================================================= */
    document.getElementById('btn-reset-charges').addEventListener('click', () => {
      const activeMonth = selectedMonth === 'ALL' ? currentYYYYMM : selectedMonth;
      if (confirm(`Voulez-vous réinitialiser les cases de l'onglet Charges Fixes pour le mois sélectionné (${activeMonth}) ?`)) {
        if (!data.monthlyChargesState) data.monthlyChargesState = {};
        data.monthlyChargesState[activeMonth] = {};
        (data.page2 || []).forEach(t => {
          data.monthlyChargesState[activeMonth][t.id] = { pointage: true, traite: false };
        });
        save();
      }
    });

    /* =========================================================
       FILTRE MOIS
    ========================================================= */
    const monthFilterSelect = document.getElementById('month-filter');
    monthFilterSelect.addEventListener('change', (e) => {
      selectedMonth = e.target.value;
      render();
    });

    function updateMonthFilterOptions() {
      const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
      const monthsSet = new Set();
      monthsSet.add(currentYYYYMM);

      const [curY, curM] = currentYYYYMM.split('-').map(Number);
      const nextDate = new Date(curY, curM, 1);
      const nextYYYYMM = `${nextDate.getFullYear()}-${String(nextDate.getMonth() + 1).padStart(2, '0')}`;
      monthsSet.add(nextYYYYMM);

      (data.page1 || []).forEach(t => {
        if (t.date && t.date.length >= 7) {
          monthsSet.add(t.date.substring(0, 7));
        }
      });

      Object.keys(data.monthlyChargesState || {}).forEach(monthKey => {
        if (monthKey !== 'ALL') monthsSet.add(monthKey);
      });

      const sortedMonths = Array.from(monthsSet).sort().reverse();
      let optionsHtml = '';

      sortedMonths.forEach(mKey => {
        const [year, month] = mKey.split('-');
        const monthIndex = parseInt(month, 10) - 1;
        const name = monthNames[monthIndex] || month;
        let suffix = '';
        if (mKey === currentYYYYMM) suffix = ' (En cours)';
        else if (mKey === nextYYYYMM) suffix = ' (Mois prochain)';

        const label = `${name} ${year}${suffix}`;
        optionsHtml += `<option value="${mKey}" ${selectedMonth === mKey ? 'selected' : ''}>${label}</option>`;
      });

      optionsHtml += `<option value="ALL" ${selectedMonth === 'ALL' ? 'selected' : ''}>-- Tous les mois --</option>`;
      monthFilterSelect.innerHTML = optionsHtml;
    }

    /* =========================================================
       RESERVES
    ========================================================= */
    function attachReserveSelectHandler() {
      const selectReserve = document.getElementById('reserve-category');
      if (!selectReserve) return;
      selectReserve.addEventListener('change', (e) => {
        if (e.target.value === '__new__') {
          const name = prompt('Nom de la nouvelle réserve (ex: Travaux, Voiture...) :');
          if (name && name.trim() !== '') {
            const cleanName = name.trim();
            if (!data.reservesCategories.includes(cleanName)) {
              data.reservesCategories.push(cleanName);
              save();
            }
            selectReserve.value = cleanName;
          } else {
            selectReserve.value = 'none';
          }
        }
      });
    }

    /* =========================================================
       FORMULAIRE + TABLEAU
    ========================================================= */
    function updateFormAndHead() {
      const formFields = document.getElementById('form-fields');
      const tableHead = document.getElementById('table-head');
      const categories = data.reservesCategories || ['Vacances', 'Noël'];
      const optionsReserves = categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');

      if (currentPage === 'page1') {
        const today = new Date().toISOString().split('T')[0];
        formFields.innerHTML = `
          <input type="date" id="date" value="${today}" required>
          <input type="text" id="cheque" placeholder="Chèque (optionnel)">
          <input type="text" id="ordre" placeholder="Libellé / Intitulé" required>
          <input type="number" step="0.01" id="retrait" placeholder="Retrait (€)">
          <input type="number" step="0.01" id="versement" placeholder="Versement (€)">
          <select id="reserve-category">
            <option value="none">Compte Courant</option>
            ${optionsReserves}
            <option value="__new__">+ Créer une nouvelle réserve...</option>
          </select>
        `;
        attachReserveSelectHandler();
        tableHead.innerHTML = `
          <th>Date</th>
          <th>Chèque</th>
          <th>Libellé</th>
          <th class="amount">Retrait</th>
          <th class="amount">Versement</th>
          <th class="amount">Solde Compte</th>
          <th class="center">Pointé</th>
          <th class="center">Action</th>
        `;
      } else {
        const activeMonth = selectedMonth === 'ALL' ? currentYYYYMM : selectedMonth;
        const allChecked = data.page2.length > 0 && data.page2.every(t => getChargeState(t.id, activeMonth).pointage);
        const allProcessed = data.page2.length > 0 && data.page2.every(t => getChargeState(t.id, activeMonth).traite);

        formFields.innerHTML = `
          <input type="text" id="cheque" placeholder="Chèque (optionnel)">
          <input type="text" id="ordre" placeholder="Nom de l'opération" required>
          <input type="number" step="0.01" id="retrait" placeholder="Charge / Débit (€)">
          <input type="number" step="0.01" id="versement" placeholder="Revenu / Crédit (€)">
          <select id="reserve-category">
            <option value="none">Compte Courant</option>
            ${optionsReserves}
            <option value="__new__">+ Créer une nouvelle réserve...</option>
          </select>
        `;
        attachReserveSelectHandler();
        tableHead.innerHTML = `
          <th>Chèque</th>
          <th>Nom / Libellé</th>
          <th class="amount">Charge (-)</th>
          <th class="amount">Revenu (+)</th>
          <th class="center">Inclus <input type="checkbox" id="toggle-all-charges" ${allChecked ? 'checked' : ''}></th>
          <th class="center">Traité <input type="checkbox" id="toggle-all-traite" ${allProcessed ? 'checked' : ''}></th>
          <th class="center">Action</th>
        `;

        const toggleAll = document.getElementById('toggle-all-charges');
        if (toggleAll) {
          toggleAll.addEventListener('change', (e) => {
            data.page2.forEach(t => {
              setChargeState(t.id, activeMonth, 'pointage', e.target.checked);
            });
            save();
          });
        }

        const toggleAllTraite = document.getElementById('toggle-all-traite');
        if (toggleAllTraite) {
          toggleAllTraite.addEventListener('change', (e) => {
            data.page2.forEach(t => {
              setChargeState(t.id, activeMonth, 'traite', e.target.checked);
            });
            save();
          });
        }
      }
    }

    /* =========================================================
       AJOUT OPERATION
    ========================================================= */
    document.getElementById('transaction-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const reserveCat = document.getElementById('reserve-category').value;
      const isReserve = reserveCat !== 'none' && reserveCat !== '__new__';

      const newEntry = {
        id: Date.now(),
        cheque: document.getElementById('cheque').value || '',
        ordre: document.getElementById('ordre').value || '',
        retrait: parseFloat(document.getElementById('retrait').value) || 0,
        versement: parseFloat(document.getElementById('versement').value) || 0,
        pointage: currentPage === 'page2' ? true : false,
        traite: false,
        isReserve: isReserve,
        reserveCategory: isReserve ? reserveCat : ''
      };

      if (currentPage === 'page1') {
        newEntry.date = document.getElementById('date').value || new Date().toISOString().split('T')[0];
      }

      data[currentPage].push(newEntry);

      if (currentPage === 'page2') {
        const activeMonth = selectedMonth === 'ALL' ? currentYYYYMM : selectedMonth;
        setChargeState(newEntry.id, activeMonth, 'pointage', true);
        setChargeState(newEntry.id, activeMonth, 'traite', false);
      }

      save();
      e.target.reset();
      const dateEl = document.getElementById('date');
      if (dateEl) {
        dateEl.value = new Date().toISOString().split('T')[0];
      }
      updateMonthFilterOptions();
    });

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      const parts = dateStr.split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateStr;
    }

    /* =========================================================
       MOTEUR DE CALCUL DES SOLDES (COMPTE COURANT & RÉSERVES)
    ========================================================= */
    function calculateAllBalances(targetMonthKey) {
      let ccBalance = 0;
      let reserves = {};
      (data.reservesCategories || ['Vacances', 'Noël']).forEach(cat => { reserves[cat] = 0; });

      // 1. Calculer sur Page 1 (Opérations)
      const sortedOps = [...(data.page1 || [])].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
      sortedOps.forEach(op => {
        const opMonth = op.date ? op.date.substring(0, 7) : '';
        const includeOp = (targetMonthKey === 'ALL') || (opMonth <= targetMonthKey);

        if (!includeOp) return;

        if (op.isReserve && op.reserveCategory) {
          // Virement vers réserve (Versement) -> Compte courant baisse, Réserve augmente
          // Dépense depuis réserve (Retrait) -> Réserve diminue uniquement, Compte courant ne bouge pas
          if (!reserves.hasOwnProperty(op.reserveCategory)) reserves[op.reserveCategory] = 0;

          if (op.versement > 0) {
            ccBalance -= op.versement;
            reserves[op.reserveCategory] += op.versement;
          }
          if (op.retrait > 0) {
            reserves[op.reserveCategory] -= op.retrait;
            // Ne touche pas au compte courant (dépense gérée par la réserve directement)
          }
        } else {
          // Opération standard sur le Compte Courant
          ccBalance += (op.versement || 0) - (op.retrait || 0);
        }
      });

      // 2. Calculer sur Page 2 (Charges Fixes pointées pour le mois)
      const activeMonth = targetMonthKey === 'ALL' ? currentYYYYMM : targetMonthKey;
      (data.page2 || []).forEach(chg => {
        const state = getChargeState(chg.id, activeMonth);
        if (state.pointage) {
          if (chg.isReserve && chg.reserveCategory) {
            if (!reserves.hasOwnProperty(chg.reserveCategory)) reserves[chg.reserveCategory] = 0;
            if (chg.versement > 0) {
              ccBalance -= chg.versement;
              reserves[chg.reserveCategory] += chg.versement;
            }
            if (chg.retrait > 0) {
              reserves[chg.reserveCategory] -= chg.retrait;
            }
          } else {
            ccBalance += (chg.versement || 0) - (chg.retrait || 0);
          }
        }
      });

      let totalReserves = Object.values(reserves).reduce((a, b) => a + b, 0);
      let globalSolde = ccBalance + totalReserves;

      return { ccBalance, reserves, globalSolde };
    }

    /* =========================================================
       RENDU DU TABLEAU ET DES TOTAUX
    ========================================================= */
    function render() {
      const tableBody = document.getElementById('table-body');
      const summaryBar = document.getElementById('summary-bar');
      const activeMonth = selectedMonth === 'ALL' ? currentYYYYMM : selectedMonth;

      tableBody.innerHTML = '';

      if (currentPage === 'page1') {
        const filteredOps = (data.page1 || []).filter(t => {
          if (selectedMonth === 'ALL') return true;
          return t.date && t.date.substring(0, 7) === selectedMonth;
        }).sort((a, b) => (a.date || '').localeCompare(b.date || ''));

        // Calcul progressif du solde du compte courant ligne par ligne
        let runningCC = 0;
        // Pour afficher le solde exact par ligne, on calcule depuis le début
        const allSorted = [...(data.page1 || [])].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        
        let runningMap = {};
        let currentCCVal = 0;
        allSorted.forEach(op => {
          if (op.isReserve && op.reserveCategory) {
            if (op.versement > 0) currentCCVal -= op.versement;
          } else {
            currentCCVal += (op.versement || 0) - (op.retrait || 0);
          }
          runningMap[op.id] = currentCCVal;
        });

        if (filteredOps.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="8" class="center" style="color:var(--text-muted);padding:30px;">Aucune opération pour cette période.</td></tr>`;
        } else {
          filteredOps.forEach(t => {
            const tr = document.createElement('tr');
            if (t.isReserve) tr.classList.add('row-reserve');

            const reserveBadge = t.isReserve ? `<span class="tag-reserve">${t.reserveCategory}</span>` : '';
            const retraitClass = t.retrait > 0 ? 'amount amount-minus' : 'amount';
            const versementClass = t.versement > 0 ? 'amount amount-plus' : 'amount';
            const soldeVal = runningMap[t.id] !== undefined ? runningMap[t.id] : 0;
            const soldeClass = soldeVal < 0 ? 'amount negative' : 'amount';

            tr.innerHTML = `
              <td>${formatDate(t.date)}</td>
              <td>${t.cheque || '-'}</td>
              <td>${reserveBadge}${t.ordre}</td>
              <td class="${retraitClass}">${t.retrait ? '-' + t.retrait.toFixed(2) + ' €' : '-'}</td>
              <td class="${versementClass}">${t.versement ? '+' + t.versement.toFixed(2) + ' €' : '-'}</td>
              <td class="${soldeClass}">${soldeVal.toFixed(2)} €</td>
              <td class="center"><input type="checkbox" ${t.pointage ? 'checked' : ''} disabled></td>
              <td class="center"><button class="btn-del" onclick="deleteEntry('page1', ${t.id})">🗑️</button></td>
            `;
            tableBody.appendChild(tr);
          });
        }

      } else {
        // Page 2 : Charges Fixes
        const charges = data.page2 || [];
        if (charges.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="7" class="center" style="color:var(--text-muted);padding:30px;">Aucune charge fixe enregistrée.</td></tr>`;
        } else {
          charges.forEach(t => {
            const state = getChargeState(t.id, activeMonth);
            const tr = document.createElement('tr');
            if (t.isReserve) tr.classList.add('row-reserve');
            const reserveBadge = t.isReserve ? `<span class="tag-reserve">${t.reserveCategory}</span>` : '';

            tr.innerHTML = `
              <td>${t.cheque || '-'}</td>
              <td>${reserveBadge}${t.ordre}</td>
              <td class="amount amount-minus">${t.retrait ? '-' + t.retrait.toFixed(2) + ' €' : '-'}</td>
              <td class="amount amount-plus">${t.versement ? '+' + t.versement.toFixed(2) + ' €' : '-'}</td>
              <td class="center"><input type="checkbox" ${state.pointage ? 'checked' : ''} onchange="toggleChargeState(${t.id}, 'pointage', this.checked)"></td>
              <td class="center"><input type="checkbox" ${state.traite ? 'checked' : ''} onchange="toggleChargeState(${t.id}, 'traite', this.checked)"></td>
              <td class="center"><button class="btn-del" onclick="deleteEntry('page2', ${t.id})">🗑️</button></td>
            `;
            tableBody.appendChild(tr);
          });
        }
      }

      // Rendu de la barre de résumé
      const balances = calculateAllBalances(selectedMonth);
      let summaryHtml = `
        <div class="summary-card">
          <div class="summary-title">Compte Courant</div>
          <div class="summary-val ${balances.ccBalance < 0 ? 'negative' : ''}">${balances.ccBalance.toFixed(2)} €</div>
        </div>
      `;

      Object.entries(balances.reserves).forEach(([resName, resVal]) => {
        summaryHtml += `
          <div class="summary-card">
            <div class="summary-title">Réserve ${resName}</div>
            <div class="summary-val reserve ${resVal < 0 ? 'negative' : ''}">${resVal.toFixed(2)} €</div>
          </div>
        `;
      });

      summaryHtml += `
        <div class="summary-card" style="border-color: var(--accent);">
          <div class="summary-title">Solde Global</div>
          <div class="summary-val total ${balances.globalSolde < 0 ? 'negative' : ''}">${balances.globalSolde.toFixed(2)} €</div>
        </div>
      `;

      summaryBar.innerHTML = summaryHtml;
    }

    function toggleChargeState(id, key, value) {
      const activeMonth = selectedMonth === 'ALL' ? currentYYYYMM : selectedMonth;
      setChargeState(id, activeMonth, key, value);
      save();
    }

    function deleteEntry(page, id) {
      if (confirm("Voulez-vous vraiment supprimer cet élément ?")) {
        data[page] = data[page].filter(item => item.id !== id);
        save();
        updateMonthFilterOptions();
      }
    }
  </script>
</body>
</html>
