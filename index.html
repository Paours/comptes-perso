<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Comptes</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --primary-grad: linear-gradient(90deg, #2563eb 0%, #3b82f6 100%);
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --warning-bg: #fffbe3;
      --info-bg: #eff6ff;
      --border: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-gradient); color: #0f172a; padding: 20px 16px; min-height: 100vh; max-width: 1000px; margin: 0 auto; }
    
    h1 { font-size: 2.2rem; margin-bottom: 20px; color: #ffffff; font-weight: 900; text-align: center; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 3px 10px rgba(0,0,0,0.3); }

    .tabs { display: flex; gap: 12px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 16px; border: none; background: rgba(255, 255, 255, 0.1); border-radius: 16px; font-weight: 800; font-size: 1.05rem; color: #ffffff; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(10px); border: 2px solid rgba(255,255,255,0.15); }
    .tab-btn.active { background: #3b82f6; color: #ffffff; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4); transform: translateY(-3px); border-color: #60a5fa; }

    .card { background: var(--card-bg); border-radius: 20px; padding: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); margin-bottom: 24px; }
    
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
    input { padding: 14px; border: 2px solid #cbd5e1; border-radius: 12px; font-size: 1rem; font-weight: 600; outline: none; width: 100%; transition: all 0.2s; background: #f8fafc; }
    input:focus { border-color: #3b82f6; background: #ffffff; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2); }
    .btn-add { background: var(--primary-grad); color: white; border: none; border-radius: 12px; font-weight: 800; font-size: 1.1rem; cursor: pointer; padding: 16px; transition: all 0.2s ease; width: 100%; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4); }
    .btn-add:hover { transform: scale(1.01); box-shadow: 0 10px 25px rgba(37, 99, 235, 0.6); }

    .table-container { overflow-x: auto; border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 1rem; }
    th { text-align: left; padding: 16px 12px; color: #ffffff; font-weight: 800; background: #1e293b; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }
    td { padding: 14px 12px; border-bottom: 2px solid #f1f5f9; font-weight: 600; }
    tr:hover td { background-color: #f8fafc; }
    
    .row-charges-total { background-color: var(--warning-bg) !important; border-left: 6px solid #f59e0b; }
    .row-charges-estime { background-color: var(--info-bg) !important; border-left: 6px solid #3b82f6; }

    .amount { text-align: right; white-space: nowrap; font-family: 'Courier New', monospace; font-size: 1.1rem; font-weight: 800; }
    .amount-plus { color: #10b981; background: var(--success-bg); padding: 4px 8px; border-radius: 8px; display: inline-block; }
    .amount-minus { color: var(--danger); background: var(--danger-bg); padding: 4px 8px; border-radius: 8px; display: inline-block; }
    .negative { color: var(--danger); font-weight: 900; }
    .center { text-align: center; }

    .summary { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; background: #0f172a; border-radius: 14px; padding: 18px 24px; margin-top: 20px; font-weight: 800; color: #ffffff; font-size: 1rem; box-shadow: 0 8px 20px rgba(15, 23, 42, 0.4); }
    .summary-val { font-size: 1.4rem; font-family: 'Courier New', monospace; color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }

    .btn-del { background: #fef2f2; border: none; color: var(--danger); border-radius: 8px; cursor: pointer; font-size: 1.1rem; padding: 6px 12px; font-weight: 900; transition: 0.2s; }
    .btn-del:hover { background: var(--danger); color: white; transform: scale(1.1); }
    
    input[type="checkbox"] { width: 22px; height: 22px; accent-color: #3b82f6; cursor: pointer; vertical-align: middle; }
  </style>
</head>
<body>

  <h1>💳 Mes Comptes 💳</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchPage('page1')">Dépenses & Revenus</button>
    <button class="tab-btn" onclick="switchPage('page2')">Charges Mensuelles</button>
  </div>

  <div class="card">
    <form id="transaction-form">
      <div class="form-grid" id="form-fields"></div>
      <button type="submit" class="btn-add">+ Ajouter l'opération</button>
    </form>
  </div>

  <div class="card">
    <div class="table-container">
      <table>
        <thead>
          <tr id="table-head"></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <div class="summary" id="summary-bar"></div>
  </div>

  <script>
    let currentPage = 'page1';
    
    let data = JSON.parse(localStorage.getItem('comptes_remi_data')) || {
      page1: [],
      page2: []
    };

    const form = document.getElementById('transaction-form');
    const formFields = document.getElementById('form-fields');
    const tableHead = document.getElementById('table-head');
    const tableBody = document.getElementById('table-body');
    const summaryBar = document.getElementById('summary-bar');

    function save() {
      localStorage.setItem('comptes_remi_data', JSON.stringify(data));
    }

    function switchPage(page) {
      currentPage = page;
      document.querySelectorAll('.tab-btn').forEach((btn, index) => {
        btn.classList.toggle('active', (page === 'page1' && index === 0) || (page === 'page2' && index === 1));
      });
      updateFormAndHead();
      render();
    }

    function updateFormAndHead() {
      if (currentPage === 'page1') {
        formFields.innerHTML = `
          <input type="date" id="date" required>
          <input type="text" id="cheque" placeholder="Chèque (facultatif)">
          <input type="text" id="ordre" placeholder="Libellé / Ordre" required>
          <input type="number" step="0.01" id="retrait" placeholder="Retrait (€)">
          <input type="number" step="0.01" id="versement" placeholder="Versement (€)">
        `;
        tableHead.innerHTML = `
          <th>Date</th>
          <th>Chèque</th>
          <th>Libellé</th>
          <th class="amount">Retrait</th>
          <th class="amount">Versement</th>
          <th class="amount">Solde</th>
          <th class="center">Pointé</th>
          <th class="center">Action</th>
        `;
      } else {
        const allChecked = data.page2.length > 0 && data.page2.every(t => t.pointage);
        formFields.innerHTML = `
          <input type="text" id="cheque" placeholder="Chèque (facultatif)">
          <input type="text" id="ordre" placeholder="Nom de la charge (ex: Loyer...)" required>
          <input type="number" step="0.01" id="retrait" placeholder="Montant Mensuel (€)" required>
        `;
        tableHead.innerHTML = `
          <th>Chèque</th>
          <th>Nom de la Charge</th>
          <th class="amount">Montant Mensuel</th>
          <th class="center">
            Pointé tout 
            <input type="checkbox" id="toggle-all-charges" ${allChecked ? 'checked' : ''} onchange="toggleAllCharges(this.checked)" title="Tout cocher / Tout décocher">
          </th>
          <th class="center">Action</th>
        `;
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const newEntry = {
        id: Date.now(),
        cheque: document.getElementById('cheque').value,
        ordre: document.getElementById('ordre').value,
        retrait: parseFloat(document.getElementById('retrait').value) || 0,
        versement: currentPage === 'page1' ? (parseFloat(document.getElementById('versement').value) || 0) : 0,
        pointage: false
      };

      if (currentPage === 'page1') {
        newEntry.date = document.getElementById('date').value;
      }

      data[currentPage].push(newEntry);
      save();
      form.reset();
      render();
    });

    function togglePointage(id, pageSource) {
      const page = pageSource || currentPage;
      data[page] = data[page].map(t => t.id === id ? { ...t, pointage: !t.pointage } : t);
      save();
      updateFormAndHead();
      render();
    }

    function toggleAllCharges(status) {
      data.page2 = data.page2.map(t => ({ ...t, pointage: status }));
      save();
      render();
    }

    function deleteTransaction(id) {
      data[currentPage] = data[currentPage].filter(t => t.id !== id);
      save();
      updateFormAndHead();
      render();
    }

    function getTotalCharges() {
      return data.page2.reduce((total, t) => total + t.retrait, 0);
    }

    function getTotalChargesPointees() {
      return data.page2.filter(t => t.pointage).reduce((total, t) => total + t.retrait, 0);
    }

    function render() {
      tableBody.innerHTML = '';
      let currentSolde = 0;
      const totalCharges = getTotalCharges();
      const chargesPointees = getTotalChargesPointees();

      if (currentPage === 'page1') {
        tableBody.innerHTML += `
          <tr>
            <td style="color: var(--text-muted)">-</td>
            <td style="color: var(--text-muted)">-</td>
            <td><strong>Solde initial</strong></td>
            <td class="amount">-</td>
            <td class="amount">-</td>
            <td class="amount"><strong>0,00 €</strong></td>
            <td class="center">-</td>
            <td></td>
          </tr>
        `;

        // Ligne des charges réellement prélevées (pointées)
        if (totalCharges > 0) {
          currentSolde -= chargesPointees;

          tableBody.innerHTML += `
            <tr class="row-charges-total">
              <td style="color: var(--text-muted)">—</td>
              <td style="color: var(--text-muted)">—</td>
              <td><strong style="color: #b45309;">Charges Prélevées (pointées)</strong></td>
              <td class="amount"><span class="amount-minus">-${chargesPointees.toFixed(2)} €</span></td>
              <td class="amount">-</td>
              <td class="amount ${currentSolde < 0 ? 'negative' : ''}">${currentSolde.toFixed(2)} €</td>
              <td class="center">-</td>
              <td></td>
            </tr>
          `;
        }

        const sortedOps = [...data.page1].sort((a, b) => new Date(a.date) - new Date(b.date));

        sortedOps.forEach(t => {
          if (t.pointage) {
            currentSolde = currentSolde - t.retrait + t.versement;
          }

          const row = document.createElement('tr');
          row.innerHTML = `
            <td style="color: var(--text-muted)">${t.date}</td>
            <td style="color: var(--text-muted)">${t.cheque || '-'}</td>
            <td><strong>${t.ordre}</strong></td>
            <td class="amount">${t.retrait > 0 ? '<span class="amount-minus">-' + t.retrait.toFixed(2) + ' €</span>' : ''}</td>
            <td class="amount">${t.versement > 0 ? '<span class="amount-plus">+' + t.versement.toFixed(2) + ' €</span>' : ''}</td>
            <td class="amount ${currentSolde < 0 ? 'negative' : ''}">${currentSolde.toFixed(2)} €</td>
            <td class="center">
              <input type="checkbox" ${t.pointage ? 'checked' : ''} onchange="togglePointage(${t.id}, 'page1')">
            </td>
            <td class="center">
              <button class="btn-del" onclick="deleteTransaction(${t.id})">✕</button>
            </td>
          `;
          tableBody.appendChild(row);
        });

        // Calcul et affichage du solde final estimé si 100% des charges étaient déduites
        const chargesRestantes = totalCharges - chargesPointees;
        const soldeApresToutesCharges = currentSolde - chargesRestantes;

        if (totalCharges > 0) {
          tableBody.innerHTML += `
            <tr class="row-charges-estime">
              <td style="color: var(--text-muted)">—</td>
              <td style="color: var(--text-muted)">—</td>
              <td><strong style="color: #1d4ed8;">Solde Final (Toutes charges déduites)</strong></td>
              <td class="amount"><span class="amount-minus">-${totalCharges.toFixed(2)} €</span></td>
              <td class="amount">-</td>
              <td class="amount ${soldeApresToutesCharges < 0 ? 'negative' : ''}"><strong>${soldeApresToutesCharges.toFixed(2)} €</strong></td>
              <td class="center">-</td>
              <td></td>
            </tr>
          `;
        }

        summaryBar.innerHTML = `
          <span>Solde Réel Actuel : <strong class="summary-val ${currentSolde < 0 ? 'negative' : ''}">${currentSolde.toFixed(2)} €</strong></span>
          <span>Solde Fin de Mois (toutes charges déduites) : <strong class="summary-val ${soldeApresToutesCharges < 0 ? 'negative' : ''}">${soldeApresToutesCharges.toFixed(2)} €</strong></span>
        `;

      } else {
        data.page2.forEach(t => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td style="color: var(--text-muted)">${t.cheque || '-'}</td>
            <td><strong>${t.ordre}</strong></td>
            <td class="amount"><span class="amount-minus">-${t.retrait.toFixed(2)} €</span></td>
            <td class="center">
              <input type="checkbox" ${t.pointage ? 'checked' : ''} onchange="togglePointage(${t.id}, 'page2')">
            </td>
            <td class="center">
              <button class="btn-del" onclick="deleteTransaction(${t.id})">✕</button>
            </td>
          `;
          tableBody.appendChild(row);
        });

        summaryBar.innerHTML = `
          <span>Total des charges mensuelles : <strong>-${totalCharges.toFixed(2)} €</strong></span>
          <span>Prélevées : <strong style="color: #38bdf8;">-${chargesPointees.toFixed(2)} €</strong></span>
        `;
      }
    }

    updateFormAndHead();
    render();
  </script>
</body>
</html>
